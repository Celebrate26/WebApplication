name: Web Application Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build project
        run: mvn clean install -DskipTests -q

      - name: Run Web Tests
        # We pass a flag to tell Maven which suite to run
        run: mvn test -DsuiteXmlFile=testing.xml
        continue-on-error: true # Allows us to still upload screenshots if tests fail

      - name: Upload Step-by-Step Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-screenshots
          # Matches your Screenshots.java: static final String screenshotDir = ... "/target/screenshots"
          path: target/screenshots/
          retention-days: 7

      - name: Upload TestNG Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-html-report
          path: target/surefire-reports/
          retention-days: 7
